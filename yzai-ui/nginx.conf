proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=ollama_cache:10m max_size=1g inactive=60m use_temp_path=off;

map "$arg_clave:$http_x_gateway_secret:$http_x_yzai_key:$http_authorization" $is_authorized {
    default 0;
    "~*^secreta123:" 1;
    "~*:jsweb_internal_prod_ed25519_592b2:" 1;
    "~*:secreta123:" 1;
    "~*Bearer secreta123$" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    # Voice Studio & Voicebox Neural TTS Engine
    location /api/voice/ {
        proxy_pass http://host.docker.internal:8010/api/voice/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_send_timeout 300s;
    }

    location /v1/audio/ {
        proxy_pass http://host.docker.internal:8000/v1/audio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    # Proxy Ollama API — Protected against unauthorized public GPU abuse
    location /api/tags {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Gateway-Secret,X-YZAI-Key' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Gateway-Secret,X-YZAI-Key' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        if ($is_authorized = 0) {
            add_header Content-Type application/json always;
            return 403 '{"error":"Forbidden: Missing or invalid authorization key for YZAI GPU API."}\n';
        }

        proxy_pass http://host.docker.internal:11434/api/tags;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location /api/ {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Gateway-Secret,X-YZAI-Key' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Gateway-Secret,X-YZAI-Key' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        if ($is_authorized = 0) {
            add_header Content-Type application/json always;
            return 403 '{"error":"Forbidden: Missing or invalid authorization key for YZAI GPU API."}\n';
        }

        proxy_pass http://host.docker.internal:11434/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Serve static UI
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
