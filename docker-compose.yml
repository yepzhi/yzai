version: '3.8'

services:
  openedai-speech:
    image: ghcr.io/matatonic/openedai-speech-min:latest
    container_name: openedai-speech
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - voices:/app/voices
      - config:/app/config

  yzai-ui:
    image: nginx:alpine
    container_name: yzai-ui
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./yzai-ui:/usr/share/nginx/html:ro
      - ./yzai-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Hermosillo
    volumes:
      - n8n_data:/home/node/.n8n

  voicestudio:
    image: ghcr.io/debpalash/omnivoice-studio:stable
    container_name: voicestudio
    restart: always
    ports:
      - "3900:3900"
    environment:
      - OMNIVOICE_API_KEY=yzai-voicestudio-local
    volumes:
      - voicestudio-data:/app/omnivoice_data
      - /home/yepzhi/.cache/huggingface:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  voices:
  config:
  n8n_data:
  voicestudio-data:


